version: 2

# Updates are batched: one PR per group per month, so they never pile up and
# go stale against main.
updates:
  # Runtime dependency (chart.js): kept separate from dev tooling so a
  # user-facing library bump is never silently bundled with build-tool noise.
  # Dev deps match `dev-dependencies` first; the runtime groups below only ever
  # catch production dependencies.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: 'development'
      runtime-minor-and-patch:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: 'chart.js'
        update-types: ['version-update:semver-major']

  # GitHub Actions: the workflows currently pin action versions by major tag
  # (e.g. actions/checkout@v4) rather than commit SHA, so Dependabot is the
  # main defense against drifting silently out of date.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns: ['*']
